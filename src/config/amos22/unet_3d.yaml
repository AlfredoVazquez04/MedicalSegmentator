model: "unet"

spatial_dims: 3
in_channels: 1
out_channels: 16  

channels: [16, 32, 64, 128, 256]        
strides: [1, 2, 2, 2]                    
kernel_size: 3                          
up_kernel_size: 3                        
num_res_units: 2                         
act: "PRELU"                           
norm: "INSTANCE"                       
dropout: 0.1                          
bias: true
adn_ordering: "NDA"                   

learning_rate: 0.0001
max_epochs: 100
roi_size: [96, 96, 96]  
optimizer: "AdamW"
weight_decay: 0.00001           
inference_batch_size: 1               
pin_memory: false